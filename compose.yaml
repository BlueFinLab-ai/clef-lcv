services:
  clef:
    build: .
    image: clef:local
    init: true
    restart: unless-stopped
    ports:
      - "${CLEF_PORT:-8080}:8080"
    environment:
      CLEF_PROFILE: ${CLEF_PROFILE:-flash}
      # Optional for authenticated model downloads; not stored in the image.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - clef-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CLEF_GPU:-0}"]
              capabilities: [gpu]
    stop_grace_period: 90s

volumes:
  clef-cache:
